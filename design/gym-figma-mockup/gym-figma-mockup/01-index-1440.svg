</defs><g id="Главная / Десктоп 1440"><g id="Фон: панели стены"><rect x="0" y="0" width="1440" height="866.4" fill="#0A0A0A"/><rect x="0" y="0" width="1440" height="866.4" fill="url(#bgGlow)"/><line x1="180" y1="0" x2="180" y2="866.4" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/><line x1="360" y1="0" x2="360" y2="866.4" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/><line x1="540" y1="0" x2="540" y2="866.4" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/><line x1="720" y1="0" x2="720" y2="866.4" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/><line x1="900" y1="0" x2="900" y2="866.4" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/><line x1="1080" y1="0" x2="1080" y2="866.4" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/><line x1="1260" y1="0" x2="1260" y2="866.4" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/><line x1="0" y1="90" x2="1440" y2="90" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="180" x2="1440" y2="180" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="270" x2="1440" y2="270" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="360" x2="1440" y2="360" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="450" x2="1440" y2="450" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="540" x2="1440" y2="540" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="630" x2="1440" y2="630" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="720" x2="1440" y2="720" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="810" x2="1440" y2="810" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/></g><g id="Контент"><rect x="0" y="57" width="1440" height="700" fill="url(#heroGlow)" id="Подсветка hero"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="54.4" font-weight="700" fill="#FFD9DC" filter="url(#tube)" id="Заголовок H1"><tspan x="186.0" y="180.1">СОСТАВЬ НЕДЕЛЮ</tspan><tspan x="186.0" y="242.7">ТРЕНИРОВОК И</tspan><tspan x="186.0" y="305.3">ПРОВЕРЬ, ЕСТЬ ЛИ В</tspan><tspan x="186.0" y="367.8">НЕЙ СМЫСЛ</tspan></text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#A89B9B"><tspan x="186.0" y="413.5">Отметь мышечные группы по дням: сайт оценит</tspan><tspan x="186.0" y="438.3">восстановление, баланс и частоту нагрузки.</tspan></text><g id="Кнопка / Собрать план"><rect x="186.0" y="460.8" width="148.9" height="49" fill="#FF2E3D" rx="4" filter="url(#glow)"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" x="260.4" y="490.8">Собрать план</text></g><g id="Карточка / Группы мышц"><rect x="186.5" y="582.3" width="339.0" height="189.5" fill="url(#cardGrad)" stroke="#2E2628" stroke-width="1"/><rect x="186.0" y="581.8" width="340.0" height="2" fill="#FF2E3D" filter="url(#glow)"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F1EAEA"><tspan x="207.0" y="631.2">Группы мышц</tspan></text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1EAEA"><tspan x="207.0" y="679.2">12 групп мышц, включая ягодицы,</tspan><tspan x="207.0" y="704.0">квадрицепсы и бицепс бедра:</tspan><tspan x="207.0" y="728.8">распределяй по семи дням.</tspan></text></g><g id="Карточка / Оценка разумности"><rect x="550.5" y="582.3" width="339.0" height="189.5" fill="url(#cardGrad)" stroke="#2E2628" stroke-width="1"/><rect x="550.0" y="581.8" width="340.0" height="2" fill="#FF2E3D" filter="url(#glow)"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F1EAEA"><tspan x="571.0" y="631.2">Оценка разумности</tspan></text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1EAEA"><tspan x="571.0" y="679.2">Балл от 0 до 100 и список замечаний:</tspan><tspan x="571.0" y="704.0">перегруз, нет отдыха, перекос.</tspan></text></g><g id="Карточка / Библиотека упражнений"><rect x="914.5" y="582.3" width="339.0" height="189.5" fill="url(#cardGrad)" stroke="#2E2628" stroke-width="1"/><rect x="914.0" y="581.8" width="340.0" height="2" fill="#FF2E3D" filter="url(#glow)"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F1EAEA"><tspan x="935.0" y="631.2">Библиотека упражнений</tspan></text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1EAEA"><tspan x="935.0" y="679.2">Галерея базовых движений с</tspan><tspan x="935.0" y="704.0">увеличением по клику.</tspan></text></g></g><g id="Шапка"><rect x="0" y="0" width="1440" height="57" fill="#080808" filter="url(#hdrglow)"/><line x1="0" y1="56.5" x2="1440" y2="56.5" stroke="#FF2E3D" stroke-width="1"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="20.8" font-weight="800" fill="#FFD9DC" filter="url(#tube)" id="Логотип"><tspan x="16" y="35.7">Железный план</tspan></text><g id="Меню"><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFD9DC" filter="url(#tube)" x="942.7" y="34">Главная</text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#A89B9B" x="1032.5" y="34">Конструктор плана</text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#A89B9B" x="1193.8" y="34">Упражнения</text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#A89B9B" x="1308.0" y="34">Обратная связь</text></g></g><g id="Футер"><rect x="0" y="804.4" width="1440" height="62.1" fill="#050505"/><line x1="0" y1="804.9" x2="1440" y2="804.9" stroke="#FF2E3D" stroke-width="1"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="13.6" font-weight="400" fill="#A89B9B" text-anchor="middle"><tspan x="720.0" y="840.9">© 2026 Железный план. Учебный проект. Не заменяет консультацию тренера и врача.</tspan></text></g></g></svg>