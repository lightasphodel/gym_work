</defs><g id="Главная / Планшет 820"><g id="Фон: панели стены"><rect x="0" y="0" width="820" height="945.1" fill="#0A0A0A"/><rect x="0" y="0" width="820" height="945.1" fill="url(#bgGlow)"/><line x1="180" y1="0" x2="180" y2="945.1" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/><line x1="360" y1="0" x2="360" y2="945.1" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/><line x1="540" y1="0" x2="540" y2="945.1" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/><line x1="720" y1="0" x2="720" y2="945.1" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/><line x1="0" y1="90" x2="820" y2="90" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="180" x2="820" y2="180" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="270" x2="820" y2="270" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="360" x2="820" y2="360" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="450" x2="820" y2="450" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="540" x2="820" y2="540" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="630" x2="820" y2="630" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="720" x2="820" y2="720" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="810" x2="820" y2="810" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="900" x2="820" y2="900" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/></g><g id="Контент"><rect x="0" y="57" width="820" height="700" fill="url(#heroGlow)" id="Подсветка hero"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="41.6" font-weight="700" fill="#FFD9DC" filter="url(#tube)" id="Заголовок H1"><tspan x="16" y="128.1">СОСТАВЬ НЕДЕЛЮ</tspan><tspan x="16" y="175.9">ТРЕНИРОВОК И</tspan><tspan x="16" y="223.8">ПРОВЕРЬ, ЕСТЬ ЛИ В</tspan><tspan x="16" y="271.6">НЕЙ СМЫСЛ</tspan></text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#A89B9B"><tspan x="16" y="314.6">Отметь мышечные группы по дням: сайт оценит</tspan><tspan x="16" y="339.4">восстановление, баланс и частоту нагрузки.</tspan></text><g id="Кнопка / Собрать план"><rect x="16" y="362.0" width="148.9" height="49" fill="#FF2E3D" rx="4" filter="url(#glow)"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" x="90.4" y="392.0">Собрать план</text></g><g id="Карточка / Группы мышц"><rect x="16.5" y="443.5" width="385.0" height="164.7" fill="url(#cardGrad)" stroke="#2E2628" stroke-width="1"/><rect x="16.0" y="443.0" width="386.0" height="2" fill="#FF2E3D" filter="url(#glow)"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F1EAEA"><tspan x="37.0" y="492.3">Группы мышц</tspan></text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1EAEA"><tspan x="37.0" y="540.3">12 групп мышц, включая ягодицы, квадрицепсы</tspan><tspan x="37.0" y="565.1">и бицепс бедра: распределяй по семи дням.</tspan></text></g><g id="Карточка / Оценка разумности"><rect x="418.5" y="443.5" width="385.0" height="164.7" fill="url(#cardGrad)" stroke="#2E2628" stroke-width="1"/><rect x="418.0" y="443.0" width="386.0" height="2" fill="#FF2E3D" filter="url(#glow)"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F1EAEA"><tspan x="439.0" y="492.3">Оценка разумности</tspan></text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1EAEA"><tspan x="439.0" y="540.3">Балл от 0 до 100 и список замечаний: перегруз,</tspan><tspan x="439.0" y="565.1">нет отдыха, перекос.</tspan></text></g><g id="Карточка / Библиотека упражнений"><rect x="16.5" y="625.2" width="385.0" height="164.7" fill="url(#cardGrad)" stroke="#2E2628" stroke-width="1"/><rect x="16.0" y="624.7" width="386.0" height="2" fill="#FF2E3D" filter="url(#glow)"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F1EAEA"><tspan x="37.0" y="674.0">Библиотека упражнений</tspan></text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1EAEA"><tspan x="37.0" y="722.0">Галерея базовых движений с увеличением по</tspan><tspan x="37.0" y="746.8">клику.</tspan></text></g></g><g id="Шапка"><rect x="0" y="0" width="820" height="57" fill="#080808" filter="url(#hdrglow)"/><line x1="0" y1="56.5" x2="820" y2="56.5" stroke="#FF2E3D" stroke-width="1"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="20.8" font-weight="800" fill="#FFD9DC" filter="url(#tube)" id="Логотип"><tspan x="16" y="35.7">Железный план</tspan></text><g id="Меню"><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFD9DC" filter="url(#tube)" x="322.7" y="34">Главная</text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#A89B9B" x="412.5" y="34">Конструктор плана</text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#A89B9B" x="573.8" y="34">Упражнения</text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#A89B9B" x="688.0" y="34">Обратная связь</text></g></g><g id="Футер"><rect x="0" y="883.0" width="820" height="62.1" fill="#050505"/><line x1="0" y1="883.5" x2="820" y2="883.5" stroke="#FF2E3D" stroke-width="1"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="13.6" font-weight="400" fill="#A89B9B" text-anchor="middle"><tspan x="410.0" y="919.5">© 2026 Железный план. Учебный проект. Не заменяет консультацию тренера и врача.</tspan></text></g></g></svg>