</defs><g id="Главная / Смартфон 375"><g id="Фон: панели стены"><rect x="0" y="0" width="375" height="1060.6" fill="#0A0A0A"/><rect x="0" y="0" width="375" height="1060.6" fill="url(#bgGlow)"/><line x1="180" y1="0" x2="180" y2="1060.6" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/><line x1="360" y1="0" x2="360" y2="1060.6" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/><line x1="0" y1="90" x2="375" y2="90" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="180" x2="375" y2="180" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="270" x2="375" y2="270" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="360" x2="375" y2="360" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="450" x2="375" y2="450" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="540" x2="375" y2="540" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="630" x2="375" y2="630" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="720" x2="375" y2="720" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="810" x2="375" y2="810" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="900" x2="375" y2="900" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/><line x1="0" y1="990" x2="375" y2="990" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/></g><g id="Контент"><rect x="0" y="57" width="375" height="700" fill="url(#heroGlow)" id="Подсветка hero"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="30.4" font-weight="700" fill="#FFD9DC" filter="url(#tube)" id="Заголовок H1"><tspan x="16" y="117.6">СОСТАВЬ НЕДЕЛЮ</tspan><tspan x="16" y="152.5">ТРЕНИРОВОК И</tspan><tspan x="16" y="187.5">ПРОВЕРЬ, ЕСТЬ ЛИ В</tspan><tspan x="16" y="222.5">НЕЙ СМЫСЛ</tspan></text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#A89B9B"><tspan x="16" y="263.1">Отметь мышечные группы по дням: сайт оценит</tspan><tspan x="16" y="287.9">восстановление, баланс и частоту нагрузки.</tspan></text><g id="Кнопка / Собрать план"><rect x="16" y="310.4" width="148.9" height="49" fill="#FF2E3D" rx="4" filter="url(#glow)"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" x="90.4" y="340.4">Собрать план</text></g><g id="Карточка / Группы мышц"><rect x="16.5" y="391.9" width="342.0" height="189.5" fill="url(#cardGrad)" stroke="#2E2628" stroke-width="1"/><rect x="16.0" y="391.4" width="343.0" height="2" fill="#FF2E3D" filter="url(#glow)"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F1EAEA"><tspan x="37.0" y="440.8">Группы мышц</tspan></text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1EAEA"><tspan x="37.0" y="488.8">12 групп мышц, включая ягодицы,</tspan><tspan x="37.0" y="513.6">квадрицепсы и бицепс бедра:</tspan><tspan x="37.0" y="538.4">распределяй по семи дням.</tspan></text></g><g id="Карточка / Оценка разумности"><rect x="16.5" y="598.5" width="342.0" height="164.7" fill="url(#cardGrad)" stroke="#2E2628" stroke-width="1"/><rect x="16.0" y="598.0" width="343.0" height="2" fill="#FF2E3D" filter="url(#glow)"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F1EAEA"><tspan x="37.0" y="647.3">Оценка разумности</tspan></text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1EAEA"><tspan x="37.0" y="695.3">Балл от 0 до 100 и список замечаний:</tspan><tspan x="37.0" y="720.1">перегруз, нет отдыха, перекос.</tspan></text></g><g id="Карточка / Библиотека упражнений"><rect x="16.5" y="780.2" width="342.0" height="164.7" fill="url(#cardGrad)" stroke="#2E2628" stroke-width="1"/><rect x="16.0" y="779.7" width="343.0" height="2" fill="#FF2E3D" filter="url(#glow)"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F1EAEA"><tspan x="37.0" y="829.0">Библиотека упражнений</tspan></text><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1EAEA"><tspan x="37.0" y="877.0">Галерея базовых движений с</tspan><tspan x="37.0" y="901.8">увеличением по клику.</tspan></text></g></g><g id="Шапка"><rect x="0" y="0" width="375" height="57" fill="#080808" filter="url(#hdrglow)"/><line x1="0" y1="56.5" x2="375" y2="56.5" stroke="#FF2E3D" stroke-width="1"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="20.8" font-weight="800" fill="#FFD9DC" filter="url(#tube)" id="Логотип"><tspan x="16" y="35.7">Железный план</tspan></text><g id="Бургер"><rect x="317.5" y="11.5" width="41" height="33" fill="none" stroke="#FF2E3D" stroke-width="1" rx="4" filter="url(#glow)"/><rect x="328" y="20" width="20" height="2" fill="#FF2E3D"/><rect x="328" y="27" width="20" height="2" fill="#FF2E3D"/><rect x="328" y="34" width="20" height="2" fill="#FF2E3D"/></g></g><g id="Футер"><rect x="0" y="977.4" width="375" height="83.2" fill="#050505"/><line x1="0" y1="977.9" x2="375" y2="977.9" stroke="#FF2E3D" stroke-width="1"/><text font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="13.6" font-weight="400" fill="#A89B9B" text-anchor="middle"><tspan x="187.5" y="1013.9">© 2026 Железный план. Учебный проект. Не заменяет</tspan><tspan x="187.5" y="1035.0">консультацию тренера и врача.</tspan></text></g></g></svg>