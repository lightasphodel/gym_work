<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Панель администратора — Тренировочный дневник</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/">Тренировочный дневник</a>
      <button type="button" class="burger" aria-expanded="false" aria-controls="site-nav" aria-label="Открыть меню"><span></span><span></span><span></span></button>
      <nav class="nav" id="site-nav" aria-label="Основная навигация">
        <a class="nav__link" href="/admin" aria-current="page">Панель администратора</a>
        <span class="nav__user" data-user-login></span>
        <button type="button" class="nav__link" id="logout-button">Выйти</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <h1 class="page__title">Панель администратора</h1>
      <div class="page__content">
        <div class="alert alert--error" id="page-error" role="alert" hidden></div>
        <section class="card" aria-labelledby="account-title">
          <h2 id="account-title">Учётная запись</h2>
          <dl class="details">
            <dt>Логин</dt><dd data-user-field="login"></dd>
            <dt>Электронная почта</dt><dd data-user-field="email"></dd>
            <dt>Роль</dt><dd data-user-field="role"></dd>
            <dt>Дата регистрации</dt><dd data-user-field="createdAt"></dd>
          </dl>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 Тренировочный дневник. Курсовой проект. Не заменяет консультацию тренера и врача.</p>
  </footer>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/session.js"></script>
</body>
</html>
